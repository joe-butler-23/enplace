<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Kanban client fixture</title>
		<link rel="stylesheet" href="../../dist-kanban-client/kanban-client.css" />
		<style>
			body { margin: 0; padding: 24px; font: 16px sans-serif; }
			#board { width: 720px; }
			.kanban-container { gap: 16px; }
			.kanban-board { border: 1px solid #aaa; }
			.kanban-board-header, .kanban-item { padding: 12px; }
			.kanban-item { margin: 4px; border: 1px solid #ccc; background: white; }
		</style>
	</head>
	<body>
		<div id="board"></div>
		<script type="module">
			import { createKanbanClient } from "../../dist-kanban-client/kanban-client.mjs";

			const events = [];
			let lastDropElement;
			const host = document.querySelector("#board");
			const boards = [
				{
					id: "backlog",
					titleHtml: "Backlog",
					cards: [
						{ id: "one", html: '<span>One</span><button data-kanban-action="remove">Remove</button>', classes: ["card-one"] },
						{ id: "two", html: "<span>Two</span>", classes: ["card-two"] },
						{ id: "group", html: "<span>Group heading</span>", classes: ["group-heading", "not-draggable"] },
					],
				},
				{ id: "done", titleHtml: "Done", cards: [] },
			];
			const client = createKanbanClient({
				element: host,
				boards,
				presentation: { widthBoard: "40%" },
				callbacks: {
					copyItem: () => window.kanbanFixture.copy,
					dragEl: (element) => events.push({ type: "drag", cardId: element.dataset.eid }),
					dragendEl: (element) => events.push({ type: "dragend", cardId: element.dataset.eid }),
					onDrop: ({ element, container, ...move }) => {
						lastDropElement = element;
						events.push({ type: "drop", ...move });
					},
					onCardClick: (event, cardId) => events.push({ type: "click", cardId, defaultPrevented: event.defaultPrevented }),
					onAction: (name, cardId) => events.push({ type: "action", name, cardId }),
				},
				onLanesRendered: (laneIds) => events.push({ type: "render", laneIds }),
			});

			window.kanbanFixture = {
				client,
				copy: false,
				events,
				update() {
					window.firstCard = document.querySelector('[data-eid="one"]');
					return client.patchLanes([
						{
							id: "backlog",
							cards: [
								{ id: "two", html: "<span>Two updated</span>", classes: ["card-two", "updated"] },
								{ id: "one", html: '<span>One</span><button data-kanban-action="remove">Remove</button>', classes: ["card-one"] },
							],
						},
					]);
				},
				settleCopy() {
					client.rekeyCard(lastDropElement, "one-copy");
					return client.patchLanes([
						{ id: "backlog", cards: boards[0].cards },
						{ id: "done", cards: [{ ...boards[0].cards[0], id: "one-copy" }] },
					]);
				},
			};
			document.documentElement.dataset.ready = "true";
		</script>
	</body>
</html>

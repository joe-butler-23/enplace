[workspace]
resolver = "2"
members = [
    "mep-core",
    "mep-cli",
    "mep-remote-host-helper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Joe Butler"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
scraper = "0.20"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5.0"
toml = "0.8"
url = "2.5"
image = "0.24"
sha2 = "0.10"
hex = "0.4"
notify = "6.1"
insta = "1.42"
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
